[package]
name = "solana-launch-alerts"
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.70"
description = "Verify and parse signed launch-risk alert webhooks for Solana launchpads (open standard, spec 2026-10)."
license = "MIT"
authors = ["EMERGE"]
repository = "https://github.com/Trenchwatch/solana-launch-alerts"
homepage = "https://trenchwatch.dev"
readme = "README.md"
documentation = "https://docs.rs/solana-launch-alerts"
keywords = ["solana", "webhook", "hmac", "launchpad", "alerts"]
categories = ["cryptography", "web-programming", "parser-implementations"]
include = ["src/**", "examples/**", "README.md", "LICENSE", "Cargo.toml"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde_json = "1"
